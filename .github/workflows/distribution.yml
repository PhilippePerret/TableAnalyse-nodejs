# Versions téléchargeables de l'application (macOS : .dmg, Windows :
# installateur .exe, Linux : .AppImage), fabriquées chacune sur son
# système. Lancé à la demande par _scripts/publier.command (ou depuis
# l'onglet Actions de GitHub) ; les fichiers sont dans les artefacts.
name: Distribution

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
            files: dist/*.dmg
          - os: windows-latest
            target: --win
            files: dist/*.exe
          - os: ubuntu-latest
            target: --linux
            files: dist/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: table-analyse-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error
