# Versions téléchargeables de l'application (macOS : .dmg, Windows :
# installateur .exe, Linux : .AppImage), fabriquées chacune sur son
# système, puis publiées dans la Release v<version> du dépôt. Lancé à la
# demande par _scripts/publier.command (ou depuis l'onglet Actions).
name: Distribution

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
            files: dist/*.dmg
          - os: windows-latest
            target: --win --config _scripts/build/electron-builder.win.cjs
            files: dist/*.exe
          - os: ubuntu-latest
            target: --linux
            files: dist/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: table-analyse-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  # Versions publiées dans la « Release » v<version> du dépôt (public) :
  # la page de téléchargement du site pointe vers ces fichiers
  release:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: fichiers
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          ls -l fichiers
          gh release view "v$VERSION" >/dev/null 2>&1 \
            || gh release create "v$VERSION" --latest --title "Table d'analyse $VERSION" --notes "Table d'analyse $VERSION (macOS, Windows, Linux)"
          gh release upload "v$VERSION" fichiers/* --clobber
