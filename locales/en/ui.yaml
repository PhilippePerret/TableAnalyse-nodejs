    txt: {name: "Text",          message: "Text to display"}
    ped: {name: "Pedal",         message: "Degree of the pedal"}
    cir: {name: "Circle"}
    frm: {name: "Form…", message: "Portion of the form"}
  frames:
    prt:  {name: "Part (start)",     default: "EXPO"}
    prtz: {name: "End of part",      default: "EXPO"}
    sec:  {name: "Section start",    default: "SECTION"}
    secz: {name: "End of section",   default: "SECTION"}
