# Analysis preferences (label and precision)
prefs:
  form_position:          {label: "Location of the built form"}
  form_height_1:          {label: "Height of part marks (above the system)"}
  form_height_2:          {label: "Height of section marks (above the system)"}
  form_height_3:          {label: "Height of segment marks (above the system)"}
  theme:                  {label: "Analysis theme", precision: "Defines the sizes to apply and the colors (in the color mode of the analysis)"}
  lock_systems:           {label: "Lock systems"}
  grid_horizontal_space:  {label: "Horizontal grid step"}
  grid_vertical_space:    {label: "Vertical grid step"}
  systeme_width:          {label: "Width of the systems"}
  top_first_system:       {label: "Top offset of the first system"}
  distance_systemes:      {label: "Default space between systems"}
  adjust_same_mark:       {label: "Align marks of the same type vertically"}
  snap_for_adjust_pos:    {label: "Mark alignment snap distance", precision: "Affects marks of the same type, and only if the “Align vertically” preference above is checked."}
  marque_accords_size:    {label: "Size of chord marks"}
  marque_harmonie_size:   {label: "Size of harmony marks"}
  marque_cadence_type_size: {label: "Font size of the cadence mark text (e.g. “C.P.”)"}
  marque_modulation_size: {label: "Size of modulation marks"}
  marque_emprunt_size:    {label: "Size of borrowing marks"}
  marque_cellule_size:    {label: "Size of cell names"}
  thiness_segment_line:   {label: "Segment line thickness"}
  thiness_cellule_line:   {label: "Cell line thickness"}
  thiness_border:         {label: "Box line thickness"}
  marque_pedale_size:     {label: "Size of pedals"}
  marque_texte_size_1:    {label: "Size of large texts"}
  marque_texte_size_2:    {label: "Size of medium texts"}
  measure_line_offset:    {label: "Distance of the measure number line below the system"}
  distance_after_measure_line: {label: "Distance between the measure number line and the next system"}
  marque_measure:         {label: "Size of measure numbers"}
  marque_texte_size_3:    {label: "Size of small texts"}
  marque_texte_size_4:    {label: "Size of very small texts"}
  window_width:           {label: "Window width at opening"}
  window_height:          {label: "Window height at opening"}
  last_scroll:            {label: "Scroll at opening"}
  color_mesure:           {label: "Measure numbers"}
  color_accords:          {label: "Chord names"}
  color_harmonie:         {label: "Harmonic figures"}
  color_mark_parties:     {label: "Part marks"}
  color_mark_sections:    {label: "Section marks"}
  color_cellule:          {label: "Cells & motifs"}
  color_modulations:      {label: "Modulation marks"}
  color_emprunts:         {label: "Borrowing marks"}
  color_segments:         {label: "Segments"}
  animation_tempo:        {label: "Animation tempo", precision: "Speed of the animation cursor, in quarter notes per minute (4/4 meter by default)."}
  autosave:               {label: "Autosave"}
  animate:                {label: "Animate the analysis", precision: "Marks will be displayed progressively"}

