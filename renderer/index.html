<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; script-src 'self'">
  <title data-i18n="ui.app.title"></title>
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
  <!-- STYLES -->
  <link rel="stylesheet" type="text/css" href="css/main.css">
  <link rel="stylesheet" type="text/css" href="css/AObjet.css">
  <link rel="stylesheet" type="text/css" href="css/AMark.css">
  <link rel="stylesheet" type="text/css" href="css/Forme.css">
  <link rel="stylesheet" type="text/css" href="css/Preferences.css">
  <link rel="stylesheet" type="text/css" href="css/Manuel.css">
  <link rel="stylesheet" type="text/css" href="css/Editeur.css">
  <link rel="stylesheet" type="text/css" href="css/GetterInList.css">
  <link rel="stylesheet" type="text/css" href="css/Print.css">
  <link rel="stylesheet" type="text/css" href="css/fonts.css">
  <link rel="stylesheet" type="text/css" href="css/interact.css">
  <link rel="stylesheet" type="text/css" href="css/themes.css">

  <!-- SCRIPTS (modules ES, point d'entrée : js/main.js) -->
  <script type="module" src="js/main.js"></script>

</head>
<body>

  <!-- Bande supérieure de la fenêtre (barre de titre), avec l'œuvre et
       l'analyse au centre et le voyant de modification tout à droite -->
  <div id="titlebar"><div id="window-title"></div><div id="red-light"></div></div>

  <!-- 

      TABLE D'ANALYSE 

  -->
  <section id="content">
    <!-- Partie où seront placés tous les éléments de l'analyse -->
  </section>

  <!--
      
      PANNEAU INFOS DE L'ANALYSE

    -->
  <div id="panneau_infos" class="panneau hidden">

    <table id="table_metadata">
      <tr>
        <td><span data-i18n="ui.panels.infos.piece_title"></span><sup class="required">*</sup></td>
        <td><input type="text" id="metadata_piece_title"></td>
      </tr>
      <tr>
        <td><span data-i18n="ui.panels.infos.composer"></span><sup class="required">*</sup></td>
        <td><input type="text" id="metadata_composer"></td>
      </tr>
      <tr>
        <td data-i18n="ui.panels.infos.analyse_title"></td>
        <td><input type="text" id="metadata_analyse_title"></td>
      </tr>
      <tr>
        <td><span data-i18n="ui.panels.infos.analyse_id"></span><sup class="required">*</sup></td>
        <td><input type="text" id="metadata_analyse_id" data-i18n-placeholder="ui.panels.infos.analyse_id_ph"></td>
      </tr>
      <tr>
        <td><span data-i18n="ui.panels.infos.folder"></span><sup class="required">*</sup></td>
        <td class="with-button"><input type="text" id="metadata_folder" data-i18n-placeholder="ui.panels.infos.folder_ph"> <button id="btn_choose_folder" data-i18n="ui.buttons.choose"></button></td>
      </tr>
      <tr>
        <td data-i18n="ui.panels.infos.analyst"></td>
        <td><input type="text" id="metadata_analyst" data-i18n-placeholder="ui.panels.infos.analyst_ph" value="Philippe Perret"></td>
      </tr>
      <tr>
        <td data-i18n="ui.panels.infos.systems_source"></td>
        <td class="with-button"><input type="text" id="metadata_systems_source" data-i18n-placeholder="ui.panels.infos.systems_source_ph"> <button id="btn_choose_systems" data-i18n="ui.buttons.choose"></button></td>
      </tr>
    </table>
    <div class="explication"><sup class="required">*</sup> <span data-i18n="ui.panels.infos.required"></span></div>

    <div class="buttons right">
      <button id="btn_infos_close" style="float:left;" data-i18n="ui.buttons.close"></button>
      <button id="btn_infos_create" class="creation-only btn-default" data-i18n="ui.panels.infos.create"></button>
      <button id="btn_infos_save" class="edition-only btn-default" data-i18n="ui.buttons.save"></button>
    </div>

  </div><!-- / fin du panneau -->

  <!-- 

    BOITE À OUTILS

    -->
  <div id="panneau_outils" class="panneau hidden">

    <div>
      <span><b data-i18n="ui.panels.tools.quick_score"></b><br><span data-i18n="ui.panels.tools.quick_score_desc"></span></span>
      <textarea id="music_score_code" style="width:100%;height:180px;background-color:black;color:white;"></textarea>
      <div class="right">
        <select id="assistant_muscode">
          <option value="" data-i18n="ui.panels.tools.add"></option>
          <option value="-> NOM_IMAGE" data-i18n="ui.panels.tools.image_name"></option>
          <option value="--tune F # ou G, UT3, ..." data-i18n="ui.panels.tools.tune"></option>
          <option value="--time 3/4" data-i18n="ui.panels.tools.time"></option>
          <option value="--proximity 5 # (moyenne)" data-i18n="ui.panels.tools.proximity"></option>
          <option value="--barres" data-i18n="ui.panels.tools.barres"></option>
          <option value="--no_stem" data-i18n="ui.panels.tools.no_stem"></option>
        </select>
        <button id="btn_build_score" data-i18n="ui.panels.tools.build"></button>
      </div>
    </div>

    <div>    
      <button id="btn_distribute_systems" data-i18n="ui.panels.tools.distribute"></button> <span data-i18n="ui.panels.tools.inter_system"></span>
      <input type="text" id="tool_inter_system" value="" style="width:60px">
      <div class="explication"><span data-i18n="ui.panels.tools.inter_system_desc"></span><span id="value_ecart_preferences">XXX</span>px</div>
    </div>

    <div>
      <h2 data-i18n="ui.panels.tools.export_title"></h2>
      <fieldset>      
        <div>
          <span data-i18n="ui.panels.tools.systems"></span><input type="text" id="systems_to_export" value="1">
          <div class="explication" data-i18n="ui.panels.tools.systems_desc"></div>
        </div>
        <div>
          <input type="checkbox" id="export_one_image_per_system">
          <label for="export_one_image_per_system" data-i18n="ui.panels.tools.one_per_system"></label>
        </div>
        <div class="buttons">
          <button id="btn_export_image" data-i18n="ui.panels.tools.export_image"></button>
          <span>   </span>
          <button id="btn_export_svg" data-i18n="ui.panels.tools.export_svg"></button>
        </div>
      </fieldset>
    </div>

    <div class="buttons">
      <button id="btn_close_tools" data-i18n="ui.buttons.close"></button>
    </div>

  </div>


  <div id="coordonnates">x: --- y: ---</div>
  <!--
    Modèles des menus « Options », « Marque », « Aligner », etc. de la
    barre de menus de l'application (cf. MenusBar.js) : jamais affichés.
  -->
  <div id="menus_bar_models" hidden>
    <select id="options_tool">
      <option value="" data-i18n="ui.menu.options"></option>
      <option value="cancel" data-accelerator="CmdOrCtrl+Z"></option>
      <option value="cancelInList" data-i18n="ui.options_menu.cancel_history"></option>
      <option></option>
      <option value="toggleGridV" data-checked="false" data-i18n="ui.options_menu.grid_v"></option>
      <option value="toggleGridH" data-checked="false" data-i18n="ui.options_menu.grid_h"></option>
      <option value="toggleColor" data-checked="false" data-i18n="ui.options_menu.color"></option>
      <option value="toggleLockSystems" data-checked="false" data-i18n="ui.options_menu.lock_systems"></option>
      <option value="toggleCoordinates" data-checked="false" data-i18n="ui.options_menu.coordinates"></option>
      <!-- Choix du thème, désactivé (cf. THEME_CHOICE dans Themes.js) :
      <option></option>
      <option value="theme" data-theme="A" data-i18n="ui.options_menu.theme_A"></option>
      <option value="theme" data-theme="B" data-i18n="ui.options_menu.theme_B"></option>
      <option value="theme" data-theme="C" data-i18n="ui.options_menu.theme_C"></option>
      -->
    </select>

    <select id="amark_menu">
      <option value="" data-i18n="ui.menu.mark"></option>
      <option value="toogleLock" data-ope="lock" data-i18n="ui.mark_menu.lock_one"></option>
      <option value="changeType" data-i18n="ui.mark_menu.change_type"></option>
      <option><hr/></option>
      <option value="justifyText" data-i18n="ui.mark_menu.justify"></option>
      <option value="alignTextCenter" data-i18n="ui.mark_menu.center"></option>
      <option value="alignTextRight" data-i18n="ui.mark_menu.right"></option>
      <option value="alignTextLeft" data-i18n="ui.mark_menu.left"></option>
      <option><hr/></option>
      <option value="toggleCoordinates" data-always="true" data-checked="false" data-i18n="ui.options_menu.coordinates"></option>
    </select>

    <select id="align_menu">
      <option value="" data-i18n="ui.menu.align"></option>
      <option value="top" data-i18n="ui.align_menu.top"></option>
      <option value="bottom" data-i18n="ui.align_menu.bottom"></option>
      <option value="vcenter" data-i18n="ui.align_menu.vcenter"></option>
      <option value="right" data-i18n="ui.align_menu.right"></option>
      <option value="left" data-i18n="ui.align_menu.left"></option>
      <option value="hcenter" data-i18n="ui.align_menu.hcenter"></option>
      <option><hr/></option>
      <option value="measure" data-i18n="ui.align_menu.measure"></option>
      <option value="form_height" data-i18n="ui.align_menu.form_height"></option>
      <option><hr/></option>
      <option value="cancel" data-i18n="ui.align_menu.cancel"></option>
    </select>

    <select id="adjust_menu">
      <option value="" data-i18n="ui.menu.adjust"></option>
      <option value="SV" data-i18n="ui.adjust_menu.spread_v"></option>
      <option value="SH" data-i18n="ui.adjust_menu.spread_h"></option>
      <option></option>
      <option value="H" data-i18n="ui.adjust_menu.h"></option>
      <option value="V" data-i18n="ui.adjust_menu.v"></option>
      <option></option>
      <option value="cancel" data-i18n="ui.adjust_menu.cancel"></option>
    </select>

    <select id="selection_tool">
      <option value="" data-i18n="ui.menu.selection"></option>
      <option value="groupSelection" data-i18n="ui.selection_menu.group"></option>
      <option value="degroupSelection" data-i18n="ui.selection_menu.ungroup"></option>
      <option value="selectAll" data-i18n="ui.selection_menu.select_all"></option>
    </select>

    <select id="borders_tool" style="width:120px">
      <option value="" data-i18n="ui.menu.borders"></option>
      <option value="add" data-css="no_left_border" data-i18n="ui.borders_menu.remove_left"></option>
      <option value="remove" data-css="no_left_border" data-i18n="ui.borders_menu.add_left"></option>
      <option></option>
      <option value="add" data-css="no_right_border" data-i18n="ui.borders_menu.remove_right"></option>
      <option value="remove" data-css="no_right_border" data-i18n="ui.borders_menu.add_right"></option>
      <option></option>
      <option value="add" data-css="no_bottom_border" data-i18n="ui.borders_menu.remove_bottom"></option>
      <option value="remove" data-css="no_bottom_border" data-i18n="ui.borders_menu.add_bottom"></option>
      <option></option>
      <option value="add" data-css="no_top_border" data-i18n="ui.borders_menu.remove_top"></option>
      <option value="remove" data-css="no_top_border" data-i18n="ui.borders_menu.add_top"></option>
    </select>
  </div>



</body>
</html>
