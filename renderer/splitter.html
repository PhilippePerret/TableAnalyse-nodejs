<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Splitter</title>
  <!--
    Barre de séparation de la fenêtre scindée (cf. main.js, openSplit).
    Pendant un déplacement, la vue couvre toute la fenêtre (transparente)
    pour suivre la souris ; la barre est dessinée à sa position.
  -->
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; cursor: row-resize; }
    div#bar {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 6px;
      box-sizing: border-box;
      background-color: #d0d0d0;
      border-top: 1px solid #b0b0b0;
      border-bottom: 1px solid #b0b0b0;
    }
  </style>
  <script type="module" src="js/splitter.js"></script>
</head>
<body>
  <div id="bar"></div>
</body>
</html>
